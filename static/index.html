<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --text: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --accent: #ff6600; --accent-soft: rgba(255,102,0,.12); --link: #0969da; --hover: rgba(0,0,0,.04);
    --chip-on: #1f2328; --chip-on-text: #ffffff;
    --s1: #2a78d6; --s2: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
      --accent-soft: rgba(255,102,0,.18); --link: #4493f8; --hover: rgba(255,255,255,.04);
      --chip-on: #e6edf3; --chip-on-text: #0d1117;
      --s1: #3987e5; --s2: #d95926;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
    --accent-soft: rgba(255,102,0,.18); --link: #4493f8; --hover: rgba(255,255,255,.04);
    --chip-on: #e6edf3; --chip-on-text: #0d1117;
    --s1: #3987e5; --s2: #d95926;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  svg.i { width: 16px; height: 16px; fill: currentColor; flex: none; vertical-align: -3px; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1040px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -.5px; white-space: nowrap; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .brand b { color: var(--accent); }
  .search { flex: 1; display: flex; align-items: center; max-width: 560px; min-width: 0; margin-left: auto; height: 38px;
            border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 0 10px; gap: 8px; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search { position: relative; }
  .sugg { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 6px; z-index: 20; }
  .sugg-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; padding: 6px 8px 2px; }
  .sugg a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; }
  .sugg a.on, .sugg a:hover { background: var(--bg2); }
  .sugg .m { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sugg .av { width: 18px; height: 18px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
  .search kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .nav-link { font-size: 14px; font-weight: 600; color: var(--muted); padding: 0 4px; flex: none; }
  .nav-link:hover { color: var(--text); }
  .dc-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border-radius: 8px; background: #5865F2; color: #fff; font-size: 13px; font-weight: 600; flex: none; white-space: nowrap; }
  .dc-btn:hover { background: #4752c4; }
  .dc-btn svg.i { vertical-align: 0; }
  .gh-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); font-size: 13px; font-weight: 600; flex: none; white-space: nowrap; }
  .gh-btn:hover { background: var(--bg3); }
  .gh-btn svg.i { vertical-align: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }
  .hero { padding: 20px 0 8px; }
  .hero h1 { font-size: 26px; letter-spacing: -.5px; margin: 0 0 4px; }
  .hero p { margin: 0; color: var(--muted); }
  .hero p a { color: var(--link); }

  .controls { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .tabs button { padding: 5px 14px; color: var(--muted); }
  .tabs button + button { border-left: 1px solid var(--line); }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
  .chip:hover { background: var(--bg3); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .filters select { height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); padding: 0 6px; max-width: 160px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .reset { color: var(--link); font-size: 13px; margin-left: auto; }
  .summary { color: var(--muted); font-size: 13px; padding: 12px 0 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 40px 1fr; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rank { color: var(--muted); text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .av { border-radius: 6px; background: var(--bg3); flex: none; object-fit: cover; }
  .repo .av { vertical-align: -4px; margin-right: 8px; }
  .repohead .av { border-radius: 9px; }
  .repo { font-size: 16px; font-weight: 600; color: var(--link); word-break: break-word; }
  .repo:hover { text-decoration: underline; }
  .repo .own { font-weight: 400; }
  .gh { display: inline-flex; gap: 12px; color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(127,127,127,.3); }
  .title { margin: 3px 0 2px; }
  .title a:hover { text-decoration: underline; }
  .descr { color: var(--muted); margin: 2px 0; font-size: 13px; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; align-items: center; }
  .meta a:hover { color: var(--text); text-decoration: underline; }
  .meta .pts { color: var(--accent); font-weight: 600; }
  .karma { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--bg3); font-size: 11.5px; margin-left: 2px; font-variant-numeric: tabular-nums; }
  .more-subs { color: var(--link); }
  .subs { margin: 8px 0 0; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .subs div { padding: 4px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .subs div + div { border-top: 1px dashed var(--line); }
  .subs .t { flex: 1 1 260px; }
  .subs .m { color: var(--muted); font-size: 12px; }

  .loadmore { display: block; margin: 20px auto; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); }
  .loadmore:hover { background: var(--bg3); }
  #bar { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 30; opacity: 0; transition: opacity .2s; }
  body.busy .list { opacity: .55; transition: opacity .15s .1s; }
  .empty, .loading { color: var(--muted); padding: 48px 0; text-align: center; }

  .page h1 { font-size: 24px; margin: 18px 0 6px; word-break: break-word; }
  .page .crumb { color: var(--muted); font-size: 13px; }
  .page .crumb a { color: var(--link); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 120px; background: var(--bg2); }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .repohead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .repohead h1 { margin-right: auto; }
  .ach { display: inline-flex; align-items: center; gap: 10px; margin: 10px 0 2px; padding: 6px 14px 6px 6px; border: 1px solid var(--accent); border-radius: 999px; background: var(--accent-soft); font-size: 14px; }
  .ach-medal { background: var(--accent); color: #fff; font-weight: 800; border-radius: 999px; padding: 3px 9px; font-size: 13px; }
  .ach-when { color: var(--muted); }
  .rgrid { display: flex; flex-direction: column; gap: 8px; }
  .rg-row { display: grid; grid-template-columns: 170px repeat(5, 1fr); gap: 8px; align-items: stretch; }
  .rg-name { font-size: 12.5px; color: var(--muted); align-self: center; }
  .rg-cell { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; background: var(--bg2); }
  .rg-cell span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .rg-cell b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .rg-cell small { font-size: 11px; color: var(--muted); }
  .rg-cell.top { border-color: var(--accent); background: var(--accent-soft); }
  .rg-cell.top b { color: var(--accent); }
  @media (max-width: 640px) { .rg-row { grid-template-columns: repeat(5, 1fr); gap: 5px; } .rg-name { grid-column: 1 / -1; } .rg-cell { padding: 5px 6px; } .rg-cell b { font-size: 14px; } }
  .repostats { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13.5px; margin: 10px 0 6px; align-items: center; }
  .repostats b { color: var(--text); font-variant-numeric: tabular-nums; }
  h2.sect { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 26px 0 10px; }
  .postcards { display: flex; flex-direction: column; gap: 12px; }
  .postcard { display: grid; grid-template-columns: 78px 1fr; gap: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .postcard.top { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pts-box { align-self: start; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 10px 4px; }
  .pts-box b { display: block; font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pts-box span { font-size: 11px; font-weight: 600; }
  .pc-flag { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
  .pc-body { min-width: 0; }
  .rks { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .rk { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--bg3); color: var(--text); }
  .rk.hot { background: var(--accent); color: #fff; }
  .pc-body .meta .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .postcard h3 { overflow-wrap: anywhere; margin: 0 0 4px; font-size: 17px; line-height: 1.35; }
  .postcard h3 a:hover { text-decoration: underline; }
  .postcard .meta { margin-top: 2px; }
  .discuss { max-width: 100%; display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--link); }
  .discuss:hover { background: var(--bg3); }
  .trend { margin: 6px 0 22px; }
  .trend h3 { font-size: 15px; margin: 0; }
  .trend-sub { color: var(--muted); font-size: 13px; margin: 2px 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chart { margin: 0; }
  .chart-box { position: relative; }
  .chart svg { display: block; max-width: 100%; height: auto; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .ln.s1, .chart .stem.s1 { stroke: var(--s1); } .chart .ln.s2 { stroke: var(--s2); }
  .chart .dotm.s1 { fill: var(--s1); } .chart .dotm.s2 { fill: var(--s2); }
  .chart .ring { stroke: var(--bg); stroke-width: 2; }
  .chart .stem { stroke: var(--s2); stroke-width: 2; stroke-linecap: round; opacity: .55; }
  .chart .lolli { cursor: pointer; outline: none; }
  .chart .lolli:hover .stem, .chart .lolli:focus .stem { opacity: 1; }
  .chart .hair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .dlabel { fill: var(--text); font-size: 11.5px; font-weight: 600; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .tip { position: absolute; top: 4px; pointer-events: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.12); max-width: 260px; z-index: 2; }
  .tip-h { color: var(--muted); font-size: 11.5px; margin-bottom: 3px; }
  .tip-r { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tip-t { margin-top: 3px; color: var(--text); }
  .tip-k { display: inline-block; width: 12px; height: 2px; border-radius: 1px; margin-right: 3px; }
  .tip-k.s1 { background: var(--s1); } .tip-k.s2 { background: var(--s2); }
  .chart-table summary { font-size: 12px; color: var(--muted); cursor: pointer; margin-top: 2px; }
  .chart-table table { font-size: 12px; border-collapse: collapse; margin-top: 6px; display: block; max-height: 220px; overflow: auto; }
  .chart-table th, .chart-table td { text-align: left; padding: 2px 10px 2px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .badgedetails { margin-top: 32px; border: 1px solid var(--line); border-radius: 10px; }
  .badgedetails summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .badgedetails summary::-webkit-details-marker { display: none; }
  .badgedetails summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .badgedetails[open] summary::before { transform: rotate(90deg); }
  .badgedetails .badgebox { margin: 0 12px 12px; }
  @media (max-width: 640px) {
    .postcard { grid-template-columns: 58px 1fr; gap: 12px; padding: 14px; }
    .pts-box b { font-size: 17px; }
    .postcard h3 { font-size: 15.5px; }
  }
  .og-prev { display: block; max-width: 560px; margin: 14px 0 4px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg2); }
  .og-prev img { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; object-fit: cover; }
  .og-prev:hover { border-color: var(--muted); }
  .readme-ex { font-size: 14.5px; line-height: 1.65; color: var(--text); margin: 0 0 8px; max-width: 820px; }
  .readme-ex a { color: var(--link); white-space: nowrap; }
  .more-list { list-style: none; padding: 0; margin: 0 0 8px; }
  .more-list li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .more-list a { color: var(--link); margin-right: 8px; }
  .more-list .m { color: var(--muted); font-size: 13px; }
  .badgebox { margin: 18px 0 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); }
  .badgehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .badgecode { display: flex; gap: 10px; align-items: center; }
  .badgecode code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .badgehint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .hero-badge { margin-top: 8px !important; font-size: 14px; }
  .hero-badge a { color: var(--link); font-weight: 600; }
  .hero-badge a:hover { text-decoration: underline; }
  .badgeform { display: flex; gap: 10px; margin: 18px 0 4px; flex-wrap: wrap; }
  .badgeform input { flex: 1 1 260px; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 0 12px; outline: 0; }
  .badgeform input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .badgehint a { color: var(--link); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .seg button { padding: 4px 12px; color: var(--muted); font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--chip-on); color: var(--chip-on-text); }
  .badgepreview { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 10px; background: #ffffff; }
  .badgepreview.darkbg { background: #0d1117; }
  .badgepreview img { display: block; max-width: 100%; }
  .badgefmt { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .badgefmt .seg { margin-left: 0; }
  .badgefmt .badgelink { margin-top: 0; }
  .badgecode code { white-space: pre; }
  .badgelink[hidden] { display: none; }
  .pick-row { margin: 0 0 10px; }
  .pick { height: 30px; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 0 6px; }
  .rk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rk-head .badgelink { margin: 0; color: var(--muted); }
  .rk-head .pick { max-width: 320px; }
  .badgelink { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; cursor: pointer; }
  .badgehint code { font: 12px ui-monospace, monospace; }
  .about { max-width: 720px; font-size: 15px; line-height: 1.65; }
  .about h2 { font-size: 18px; margin: 28px 0 6px; }
  .about a { color: var(--link); }
  .about code { font: 13px ui-monospace, monospace; background: var(--bg2); padding: 1px 5px; border-radius: 4px; }
  /* Side panels on the home page: trending today (left) and featured project (right). Wide screens only. */
  .layout { display: grid; grid-template-columns: minmax(0, 1040px); justify-content: center; }
  .layout > main { margin: 0; min-width: 0; }
  .rail { display: none; }
  @media (min-width: 1280px) {
    .layout.rails { grid-template-columns: 236px minmax(0, 1040px) 248px; gap: 8px; padding: 0 16px; }

<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const short = (n) => n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "m" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const date = (t) => { const d = new Date(t * 1000); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const ago = (t) => { const s = Date.now() / 1000 - t; if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`; return `${Math.round(s / 86400)} days ago`; };
const hn = (id) => `https://news.ycombinator.com/item?id=${id}`;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// Browser cache: responses live in memory for this visit and in localStorage across visits.
// Saved responses are only reused while the site's data version (from /api/stats) is unchanged.
const MEMO = new Map();
const SAVED_KEY = "hg-cache-v1";
let saved = (() => { try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || { ver: null, items: {} }; } catch { return { ver: null, items: {} }; } })();
let saveTimer = 0;
function persist(path, data) {
  if (!STATS || path.startsWith("/api/stats") || LIVE.test(path)) return;
  if (saved.ver !== STATS.version) saved = { ver: STATS.version, items: {} };
  saved.items[path] = data;
  const keys = Object.keys(saved.items);
  if (keys.length > 120) delete saved.items[keys[0]];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(saved)); }
    catch { saved.items = {}; try { localStorage.removeItem(SAVED_KEY); } catch {} }
  }, 300);
}
// Live data (trending and repo pages: points, comments, front page positions) changes every minute, so it isn't kept in
// localStorage and an in-page copy is reused for at most a minute.
const LIVE = /^\/api\/(trending|repo\?)/, LIVE_MS = 60 * 1000, liveAt = new Map();
function api(path) {
  if (LIVE.test(path) && MEMO.has(path) && Date.now() - (liveAt.get(path) || 0) > LIVE_MS) MEMO.delete(path);
  if (LIVE.test(path) && !MEMO.has(path)) liveAt.set(path, Date.now());
  if (!LIVE.test(path) && !MEMO.has(path) && STATS && saved.ver === STATS.version && saved.items[path] !== undefined) {
    MEMO.set(path, Promise.resolve(saved.items[path]));
  }
  if (!MEMO.has(path)) {
    const p = fetch(path, path.startsWith("/api/stats") ? { cache: "no-cache" } : undefined).then(r => {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(d => { persist(path, d); return d; });
    p.catch(() => MEMO.delete(path));
    MEMO.set(path, p);
    if (MEMO.size > 300) MEMO.delete(MEMO.keys().next().value);
  }
  return MEMO.get(path);
}
const prefetch = (path) => { api(path).catch(() => {}); };
let busyTimer = 0;
function busy(on) {
  const b = $("#bar");
  clearTimeout(busyTimer);
  if (on) { b.style.transition = "none"; b.style.width = "0"; b.style.opacity = "1"; b.offsetWidth; b.style.transition = "width 4s cubic-bezier(.1,.7,.2,1)"; b.style.width = "85%"; }
  else { b.style.transition = "width .15s"; b.style.width = "100%"; busyTimer = setTimeout(() => { b.style.opacity = "0"; }, 200); }
  document.body.classList.toggle("busy", on);
}

const LANG_COLORS = { Python: "#3572A5", JavaScript: "#f1e05a", TypeScript: "#3178c6", Go: "#00ADD8", Rust: "#dea584",
  C: "#555555", "C++": "#f34b7d", "C#": "#178600", Java: "#b07219", Ruby: "#701516", Swift: "#F05138", Kotlin: "#A97BFF",
  PHP: "#4F5D95", Shell: "#89e051", Haskell: "#5e5086", Elixir: "#6e4a7e", Clojure: "#db5855", Scala: "#c22d40",
  Zig: "#ec915c", Lua: "#000080", "Jupyter Notebook": "#DA5B0B", HTML: "#e34c26", CSS: "#563d7c", Dart: "#00B4AB",
  OCaml: "#ef7a08", Nim: "#ffc200", Julia: "#a270ba", R: "#198CE7", Perl: "#0298c3", "Objective-C": "#438eff",
  Erlang: "#B83998", Vue: "#41b883", Svelte: "#ff3e00", Elm: "#60B5CC", Lisp: "#3fb68b", "Common Lisp": "#3fb68b",
  "Emacs Lisp": "#c065db", Racket: "#3c5caa", V: "#4f87c4", Gleam: "#ffaff3", Odin: "#60AFFE", Crystal: "#000100",
  "F#": "#b845fc", Vim: "#199f4b", "Vim Script": "#199f4b", Assembly: "#6E4C13", Fortran: "#4d41b1", Solidity: "#AA6746",
  Nix: "#7e7eff", TeX: "#3D6117", Makefile: "#427819", Dockerfile: "#384d54", MDX: "#fcb32c", Markdown: "#083fa1" };

// ---------------------------------------------------------------- theme
function applyTheme() { const t = store.get("theme", null); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  store.set("theme", dark ? "light" : "dark"); applyTheme();
};

// ---------------------------------------------------------------- state <-> URL
const DEFAULTS = { q: "", readme: "", view: "repos", type: "", sort: "points", min_points: "", min_comments: "", min_karma: "", max_karma: "", min_stars: "", from: "", to: "", lang: "" };
function readState() {
  const p = new URLSearchParams(location.search), s = { ...DEFAULTS };
  for (const k in DEFAULTS) if (p.has(k)) s[k] = p.get(k);
  if (location.pathname === "/show-hn" && !p.has("type")) s.type = "show";
  return s;
}
function stateQuery(s, extra = {}) {
  const p = new URLSearchParams();
  for (const k in DEFAULTS) if (s[k] && s[k] !== DEFAULTS[k]) p.set(k, s[k]);
  for (const k in extra) p.set(k, extra[k]);
  return p.toString();
}
function go(url, replace = false) { history[replace ? "replaceState" : "pushState"]({}, "", url); route(); }

let STATS = null;
const statsP = api("/api/stats").then(s => (STATS = s)).catch(() => null);

// ---------------------------------------------------------------- list view
const SORTS = [["points", "Top points"], ["comments", "Most discussed"], ["karma", "Poster karma"], ["stars", "GitHub stars"],
               ["new", "Newest"], ["subs", "Most shared"], ["old", "Oldest"]];
const OPT = {
  type: [["", "All posts"], ["show", "Show HN"], ["launch", "Launch HN"], ["ask", "Ask HN"], ["tell", "Tell HN"], ["other", "Regular links"]],
  min_points: [["", "Any"], ["10", "10+"], ["50", "50+"], ["100", "100+"], ["250", "250+"], ["500", "500+"], ["1000", "1,000+"]],
  min_comments: [["", "Any"], ["5", "5+"], ["25", "25+"], ["100", "100+"], ["250", "250+"], ["500", "500+"]],
  karma: [["", "Any"], ["0-100", "Under 100 (new)"], ["0-1000", "Under 1k"], ["1000-", "1k+"], ["5000-", "5k+"], ["10000-", "10k+"], ["50000-", "50k+"], ["100000-", "100k+"]],
  min_stars: [["", "Any"], ["100", "100+"], ["1000", "1k+"], ["5000", "5k+"], ["10000", "10k+"], ["50000", "50k+"]],
};

function select(name, opts, value, label) {
  return `<label>${label}<select data-f="${name}">${opts.map(([v, t]) => `<option value="${v}"${v === value ? " selected" : ""}>${t}</option>`).join("")}</select></label>`;
}

let navToken = 0;
const dirtyNoType = (s) => Object.keys(DEFAULTS).some(k => !["view", "q", "type"].includes(k) && s[k] !== DEFAULTS[k]);
const searchUrl = (s, page) => `/api/search?${stateQuery(s, { page })}`;

async function renderList() {
  const s = readState();
  s.view = "repos";
  const token = ++navToken;
  let first;
  busy(true);
  try { first = await api(searchUrl(s, 0)); }
  catch (e) { busy(false); view.innerHTML = `<div class="empty">Something went wrong loading results. Try again.</div>`; return; }
  if (token !== navToken) return;
  busy(false);

  document.title = s.q ? `${s.q} - HackerGit`
    : s.type === "show" && !dirtyNoType(s) ? "Best Show HN projects on GitHub - HackerGit"
    : "HackerGit: every GitHub repo shared on Hacker News";
  $("#q").value = s.q;
  const years = [], now = new Date().getUTCFullYear();
  for (let y = now; y >= 2007; y--) years.push([String(y), String(y)]);
  const karmaVal = (s.min_karma || s.max_karma) ? `${s.min_karma || 0}-${s.max_karma || ""}`.replace(/^0-$/, "") : "";
  const karmaOpts = OPT.karma.some(o => o[0] === karmaVal) ? OPT.karma : [...OPT.karma, [karmaVal, karmaVal]];
  const hasStars = STATS && STATS.with_stars > 0;
  const langs = (STATS && STATS.langs) || [];
  const dirty = Object.keys(DEFAULTS).some(k => k !== "view" && k !== "q" && s[k] !== DEFAULTS[k]);
  const st = STATS;

  view.innerHTML = `
    ${!s.q && !dirty ? `<section class="hero"><h1>Every GitHub repo Hacker News has shared.</h1>
      <p>${st ? `${fmt(st.repos)} repos from ${fmt(st.stories)} Hacker News posts since ${new Date(st.first * 1000).getUTCFullYear()}. ` : ""}Search them and sort by points, comments, stars, or the karma of whoever posted it.</p>
      <p class="hero-badge"><a href="/trending">Trending today →</a> &nbsp;·&nbsp; Was your repo on Hacker News? <a href="/badges">Get a badge for your README →</a></p></section>`
      : !s.q && s.type === "show" && !dirtyNoType(s) ? `<section class="hero"><h1>Best Show HN projects on GitHub</h1>
      <p>Open source projects launched with a Show HN post, ranked by points. Filter by comments, stars or the poster's karma to find hidden gems.</p></section>` : ""}
    <section class="controls">
      <div class="row">
        ${SORTS.filter(([k]) => k !== "stars" || hasStars).map(([k, t]) => `<button class="chip${s.sort === k ? " on" : ""}" data-sort="${k}">${t}</button>`).join("")}
      </div>
      <div class="row filters">
        ${select("type", OPT.type, s.type, "Type")}
        ${select("min_points", OPT.min_points, s.min_points, "Points")}
        ${select("min_comments", OPT.min_comments, s.min_comments, "Comments")}
        ${select("karma", karmaOpts, karmaVal, "Poster karma")}
        ${hasStars ? select("min_stars", OPT.min_stars, s.min_stars, "Stars") : ""}
        ${langs.length ? select("lang", [["", "Any"], ...langs.map(l => [l, l])], s.lang, "Language") : ""}
        ${select("from", [["", "Any"], ...years], s.from, "From")}
        ${select("to", [["", "Any"], ...years], s.to, "To")}
        ${s.q ? `<label class="badgelink" title="Also match words in each repo's README"><input type="checkbox" id="readme-toggle"${s.readme === "0" ? "" : " checked"}> Include READMEs</label>` : ""}
        ${dirty ? `<button class="reset" id="reset">Clear filters</button>` : ""}
      </div>
    </section>
    <div class="summary"><span id="count"></span><span>${st && st.last_update ? `Updated ${ago(st.last_update)}` : ""}</span></div>
    <ol class="list" id="list"></ol>
    <div id="tail"></div>`;

  view.querySelectorAll("[data-sort]").forEach(b => {
    const url = "/?" + stateQuery({ ...s, sort: b.dataset.sort });
    b.onclick = () => go(url);
    b.onmouseenter = () => prefetch(searchUrl({ ...s, sort: b.dataset.sort }, 0));
  });
  view.querySelectorAll("select[data-f]").forEach(el => el.onchange = () => {
    const n = { ...s };
    if (el.dataset.f === "karma") { const [a, b] = el.value.split("-"); n.min_karma = a && a !== "0" ? a : ""; n.max_karma = b || ""; }
    else n[el.dataset.f] = el.value;
    go("/?" + stateQuery(n));
  });
  const r = $("#reset"); if (r) r.onclick = () => go("/?" + stateQuery({ ...DEFAULTS, q: s.q }));
  const rt = $("#readme-toggle"); if (rt) rt.onchange = () => go("/?" + stateQuery({ ...s, readme: rt.checked ? "" : "0" }));
  showPage(s, 0, first, token);
}

function showPage(s, page, d, token) {
  const list = $("#list"), tail = $("#tail");
  if (!list || token !== navToken) return;
  $("#count").textContent = `${fmt(d.total)} repos`;
  const start = page * d.page_size;
  list.insertAdjacentHTML("beforeend", d.results.map((r, i) => repoItem(r, start + i + 1)).join(""));
  if (!d.total) { tail.innerHTML = `<div class="empty">No repos match. Try fewer filters.</div>`; return; }
  if (start + d.results.length >= d.total) { tail.innerHTML = ""; return; }
  const next = searchUrl(s, page + 1);
  prefetch(next);  // so "Load more" is instant
  tail.innerHTML = `<button class="loadmore">Load more</button>`;
  tail.firstChild.onclick = async () => {
    tail.firstChild.disabled = true; tail.firstChild.textContent = "Loading…";
    try { showPage(s, page + 1, await api(next), token); }
    catch (e) { tail.innerHTML = `<div class="empty">Something went wrong. Try again.</div>`; }
  };
}

const dur = (m) => m >= 90 ? `${(m / 60).toFixed(m >= 600 ? 0 : 1).replace(/\.0$/, "")} h` : `${Math.max(1, Math.round(m))} min`;
function rankPills(p) {
  const out = [];

const PERIODS = [["day", "Day"], ["week", "Week"], ["month", "Month"], ["year", "Year"], ["alltime", "All time"]];

// "best" (highest points), "latest" (follows new posts) or a specific HN post id.
function postOptions(posts) {
  if (!posts || posts.length < 2) return "";
  const best = [...posts].sort((a, b) => b.points - a.points)[0];
  const latest = [...posts].sort((a, b) => b.time - a.time)[0];
  const byTime = [...posts].sort((a, b) => b.time - a.time);
  return `<option value="best">Best post (${fmt(best.points)} pts, ${date(best.time)})</option>
    <option value="latest">Latest post (${date(latest.time)}), follows new posts</option>
    <optgroup label="A specific post">${byTime.map(p => `<option value="${p.id}">${date(p.time)} · ${fmt(p.points)} pts · ${esc(p.title.slice(0, 60))}</option>`).join("")}</optgroup>`;
}
function resolvePick(posts, v) {
  if (v === "latest") return [...posts].sort((a, b) => b.time - a.time)[0];
  if (v && v !== "best") return posts.find(p => String(p.id) === v);
  return null;
}
function rankingsGrid(rankings) {
  if (!rankings || !rankings.length) return "";
  const rows = rankings.map(g => `<div class="rg-row"><div class="rg-name">${g.scope === "show" ? "Among Show HN posts" : "Among GitHub repos on HN"}</div>
    ${PERIODS.map(([k, t]) => { const v = g.ranks[k]; const lbl = k === "year" ? v.start.slice(0, 4) : t;
      return `<div class="rg-cell${v.rank <= 3 ? " top" : ""}" title="#${fmt(v.rank)} of ${fmt(v.total)} ${k === "alltime" ? "" : "posts in that " + (k === "year" ? "year" : k)}"><span>${lbl}</span><b>#${fmt(v.rank)}</b><small>of ${short(v.total)}</small></div>`; }).join("")}</div>`).join("");

}

  const sorted = [...posts].sort((a, b) => b.points - a.points || b.time - a.time);
  return `<div class="postcards">${sorted.slice(0, limit).map((p, i) => {
    const path = (p.url || "").replace(/^https?:\/\/(www\.)?github\.com\/[^/]+\/[^/#?]+/i, "");

// ---------------------------------------------------------------- charts (plain SVG, no library)
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const shortDate = (t) => { const d = new Date(t * 1000); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const timeLabel = (t, span) => {
  const d = new Date(t * 1000);
  if (span < 2 * 86400) return `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
  if (span < 400 * 86400) return shortDate(t);
  return String(d.getUTCFullYear());
};
// time ticks on round hours / days / months / years (UTC)
function timeTicks(t0, t1, max = 5) {
  const span = t1 - t0 || 1, H = 3600, D = 86400;
  if (span > 3 * 365 * D) {
    const y0 = new Date(t0 * 1000).getUTCFullYear() + 1, y1 = new Date(t1 * 1000).getUTCFullYear();
    const step = Math.max(1, Math.ceil((y1 - y0 + 1) / max)), out = [];
    for (let y = y0; y <= y1; y += step) out.push(Date.UTC(y, 0, 1) / 1000);
    return out;
  }
  const steps = [10 * 60, 30 * 60, H, 2 * H, 3 * H, 6 * H, 12 * H, D, 2 * D, 7 * D, 14 * D, 30 * D, 91 * D, 182 * D, 365 * D];
  const step = steps.find(st => span / st <= max) || steps[steps.length - 1], out = [];
  for (let t = Math.ceil(t0 / step) * step; t <= t1; t += step) out.push(t);
  return out;
}
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, raw = span / n, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw) || raw;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

// Line chart. series: [{name, cls, points: [[t, v, extra?]]}]; opts: {invert, yFmt, tipExtra, title}
function lineChart(series, opts = {}) {
  const wrap = document.createElement("figure"); wrap.className = "chart";
  const W = Math.max(300, Math.min(940, view.clientWidth - 2)), H = 190, m = { l: 44, r: series.length > 1 ? 70 : 16, t: 12, b: 26 };
  const all = series.flatMap(s => s.points);
  const t0 = Math.min(...all.map(p => p[0])), t1 = Math.max(...all.map(p => p[0]));
  let v0 = Math.min(...all.map(p => p[1])), v1 = Math.max(...all.map(p => p[1]));
  if (opts.invert) { v0 = 1; v1 = Math.max(v1, 5); }
  else if (opts.fit) { const pad = Math.max(1, (v1 - v0) * 0.15); v0 = Math.max(0, v0 - pad); v1 = v1 + pad; }
  else { v0 = Math.min(0, v0); if (v1 === v0) v1 = v0 + 1; }
  const x = (t) => m.l + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => opts.invert ? m.t + (v - v0) / (v1 - v0 || 1) * (H - m.t - m.b) : H - m.b - (v - v0) / (v1 - v0) * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": opts.title || "chart" });
  let ticks = niceTicks(v0, v1).filter(v => v >= v0 && (!opts.invert || v >= 1));
  if (opts.invert && !ticks.includes(1)) ticks = [1, ...ticks.filter(v => v - 1 > (v1 - v0) * 0.12)];
  if (opts.fit) ticks = ticks.map(Math.round);
  for (const v of ticks) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "grid" }));
    const tx = svgEl("text", { x: m.l - 8, y: y(v) + 4, class: "axis", "text-anchor": "end" }); tx.textContent = (opts.axisFmt || opts.yFmt || short)(v); svg.append(tx);
  }
  for (const t of timeTicks(t0, t1, 4)) {
    const tx = svgEl("text", { x: x(t), y: H - 6, class: "axis", "text-anchor": "middle" }); tx.textContent = timeLabel(t, t1 - t0); svg.append(tx);
  }
  for (const s of series) {
    const d = s.points.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    svg.append(svgEl("path", { d, class: `ln ${s.cls}` }));
    if (s.points.length === 1) svg.append(svgEl("circle", { cx: x(s.points[0][0]), cy: y(s.points[0][1]), r: 4, class: `dotm ${s.cls}` }));
    if (series.length > 1) {  // direct label at the line's end
      const last = s.points[s.points.length - 1];
      const lb = svgEl("text", { x: x(last[0]) + 6, y: y(last[1]) + 4, class: "dlabel" }); lb.textContent = s.name; svg.append(lb);
    }
  }
  // hover: crosshair snaps to the nearest time; one tooltip lists every series
  const hair = svgEl("line", { y1: m.t, y2: H - m.b, class: "hair", visibility: "hidden" }); svg.append(hair);
  const marks = series.map(s => { const c = svgEl("circle", { r: 4, class: `dotm ${s.cls}`, visibility: "hidden" }); svg.append(c); return c; });
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
  const hit = svgEl("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" }); svg.append(hit);
  const move = (ev) => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const tAt = t0 + (px - m.l) / (W - m.l - m.r) * (t1 - t0);
    let near = null;
    for (const p of all) if (!near || Math.abs(p[0] - tAt) < Math.abs(near - tAt)) near = p[0];
    hair.setAttribute("x1", x(near)); hair.setAttribute("x2", x(near)); hair.setAttribute("visibility", "visible");
    tip.replaceChildren();
    const head = document.createElement("div"); head.className = "tip-h"; head.textContent = new Date(near * 1000).toUTCString().slice(5, 22) + " UTC"; tip.append(head);
    const gap = Math.max(600, (t1 - t0) / 60);  // a series with no point near this time isn't listed
    series.forEach((s, i) => {
      const p = s.points.reduce((a, b) => Math.abs(b[0] - near) < Math.abs(a[0] - near) ? b : a);
      if (Math.abs(p[0] - near) > gap) { marks[i].setAttribute("visibility", "hidden"); return; }
      marks[i].setAttribute("cx", x(p[0])); marks[i].setAttribute("cy", y(p[1])); marks[i].setAttribute("visibility", "visible");
      const row = document.createElement("div"); row.className = "tip-r";
      const key = document.createElement("span"); key.className = `tip-k ${s.cls}`;
      const val = document.createElement("b"); val.textContent = (opts.yFmt || fmt)(p[1]);
      const lab = document.createElement("span"); lab.textContent = " " + s.name + (opts.tipExtra ? opts.tipExtra(p) : "");
      row.append(key, val, lab); tip.append(row);
    });
    tip.hidden = false;
    const left = Math.min(r.width - 170, Math.max(0, x(near) * r.width / W + 12));
    tip.style.left = left + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; hair.setAttribute("visibility", "hidden"); marks.forEach(c => c.setAttribute("visibility", "hidden")); });
  const box = document.createElement("div"); box.className = "chart-box"; box.append(svg, tip);
  if (series.length > 1) {
    const lg = document.createElement("div"); lg.className = "legend";
    for (const s of series) { const it = document.createElement("span"); const k = document.createElement("span"); k.className = `tip-k ${s.cls}`; it.append(k, document.createTextNode(s.name)); lg.append(it); }
    wrap.append(lg);
  }
  wrap.append(box, dataTable(series, opts));
  return wrap;
}

// Lollipop timeline: one stem per HN post (x = date, y = points). Each stem has its own tooltip.
function postsChart(posts) {
  const wrap = document.createElement("figure"); wrap.className = "chart";
  const W = Math.max(300, Math.min(940, view.clientWidth - 2)), H = 190, m = { l: 44, r: 16, t: 12, b: 26 };
  const t0 = Math.min(...posts.map(p => p.time)), t1 = Math.max(...posts.map(p => p.time));
  const pad = Math.max(86400 * 20, (t1 - t0) * 0.04), a = t0 - pad, b = t1 + pad;
  const v1 = Math.max(...posts.map(p => p.points), 1);
  const x = (t) => m.l + (t - a) / (b - a) * (W - m.l - m.r), y = (v) => H - m.b - v / v1 * (H - m.t - m.b);
  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": "Points of every Hacker News post over time" });
  for (const v of niceTicks(0, v1)) {
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: "grid" }));
    const tx = svgEl("text", { x: m.l - 8, y: y(v) + 4, class: "axis", "text-anchor": "end" }); tx.textContent = short(v); svg.append(tx);
  }
  for (const t of timeTicks(a, b, 5)) {
    const tx = svgEl("text", { x: x(t), y: H - 6, class: "axis", "text-anchor": "middle" }); tx.textContent = timeLabel(t, b - a); svg.append(tx);
  }
  const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
  const sorted = [...posts].sort((p, q) => p.points - q.points);  // big ones drawn last (on top)
  for (const p of sorted) {
    const g = svgEl("g", { class: "lolli", tabindex: 0 });
    g.append(svgEl("line", { x1: x(p.time), x2: x(p.time), y1: y(0), y2: y(p.points), class: "stem" }),
             svgEl("circle", { cx: x(p.time), cy: y(p.points), r: 4.5, class: "dotm s2 ring" }),
             svgEl("rect", { x: x(p.time) - 8, y: m.t, width: 16, height: H - m.t - m.b, fill: "transparent" }));
    const show = () => {
      tip.replaceChildren();
      const h = document.createElement("div"); h.className = "tip-h"; h.textContent = date(p.time);
      const r1 = document.createElement("div"); r1.className = "tip-r"; const bv = document.createElement("b"); bv.textContent = fmt(p.points); r1.append(bv, document.createTextNode(` points · ${fmt(p.comments)} comments`));
      const r2 = document.createElement("div"); r2.className = "tip-t"; r2.textContent = p.title;
      tip.append(h, r1, r2); tip.hidden = false;
      const r = svg.getBoundingClientRect(); tip.style.left = Math.min(r.width - 230, Math.max(0, x(p.time) * r.width / W + 12)) + "px";
    };
    g.addEventListener("pointerenter", show); g.addEventListener("focus", show);
    g.addEventListener("pointerleave", () => { tip.hidden = true; }); g.addEventListener("blur", () => { tip.hidden = true; });
    g.addEventListener("click", () => window.open(hn(p.id), "_blank", "noopener"));
    svg.append(g);
  }
  const box = document.createElement("div"); box.className = "chart-box"; box.append(svg, tip);
  wrap.append(box, dataTable([{ name: "Points", points: posts.map(p => [p.time, p.points, p.title]) }], { yFmt: fmt, dateOnly: true, extraCol: "Post" }));
  return wrap;
}

function dataTable(series, opts = {}) {
  const det = document.createElement("details"); det.className = "chart-table";
  const sum = document.createElement("summary"); sum.textContent = "Data table"; det.append(sum);
  const tbl = document.createElement("table"); const head = tbl.insertRow();
  for (const h of ["Time (UTC)", ...series.map(s => s.name), ...(opts.extraCol ? [opts.extraCol] : [])]) { const th = document.createElement("th"); th.textContent = h; head.append(th); }
  const times = [...new Set(series.flatMap(s => s.points.map(p => p[0])))].sort((a, b) => a - b);
  const step = Math.max(1, Math.ceil(times.length / 200));  // keep the table readable
  times.filter((_, i) => i % step === 0 || i === times.length - 1).forEach(t => {
    const row = tbl.insertRow();
    row.insertCell().textContent = opts.dateOnly ? date(t) : new Date(t * 1000).toISOString().slice(0, 16).replace("T", " ");
    for (const s of series) { const p = s.points.find(q => q[0] === t); row.insertCell().textContent = p ? (opts.yFmt || fmt)(p[1]) : ""; }
    if (opts.extraCol) { const p = series[0].points.find(q => q[0] === t); row.insertCell().textContent = p ? p[2] : ""; }
  });
  det.append(tbl); return det;
}

async function renderTrends(r, posts) {
  const box = $("#trends"); if (!box) return;
  const d = await api(`/api/series?key=${encodeURIComponent(r.key)}`).catch(() => null);
  if (!d || !document.body.contains(box)) return;
  const parts = [];
  const add = (title, sub, el) => {
    const sec = document.createElement("section"); sec.className = "trend";
    const h = document.createElement("h3"); h.textContent = title; sec.append(h);
    if (sub) { const p = document.createElement("p"); p.className = "trend-sub"; p.textContent = sub; sec.append(p); }
    sec.append(el); parts.push(sec);
  };
  if (posts.length > 1) add("Every Hacker News post", `${posts.length} posts. Hover a dot for details; click to open the discussion.`, postsChart(posts));
  // the most recent post with live data
  const withPts = posts.filter(p => (d.points[p.id] || []).length > 1).sort((a, b) => b.time - a.time)[0];
  if (withPts) {
    const pts = d.points[withPts.id];
    add("Points over time", `“${withPts.title}”`, lineChart([{ name: "Points", cls: "s2", points: pts }],
        { title: "Points over time", yFmt: fmt, axisFmt: short, tipExtra: (p) => ` · ${fmt(p[2])} comments` }));
  }
  const withRank = posts.filter(p => d.ranks[p.id]).sort((a, b) => b.time - a.time)[0];
  if (withRank) {
    const rk = d.ranks[withRank.id], ser = [];
    if (rk.front && rk.front.length) ser.push({ name: "Front page", cls: "s1", points: rk.front });
    if (rk.show && rk.show.length) ser.push({ name: "Show HN", cls: "s2", points: rk.show });
    if (ser.some(s => s.points.length > 1))
      add("Rank on Hacker News", `“${withRank.title}” · position over time, #1 at the top`, lineChart(ser, { invert: true, title: "Rank on Hacker News", yFmt: (v) => "#" + v }));
  }
  if (d.stars.length > 1) {
    const st = d.stars.map(([day, n]) => [Date.parse(day + "T00:00:00Z") / 1000, n]);
    add("GitHub stars", "Daily star count", lineChart([{ name: "Stars", cls: "s1", points: st }], { title: "GitHub stars", yFmt: fmt, axisFmt: short, fit: true }));
  }
  if (!parts.length) return;
  const h = document.createElement("h2"); h.className = "sect"; h.textContent = "Trends";
  box.replaceChildren(h, ...parts);
}

// "#1 Repo of the Day" style label for a repo's best achievement (mirrors ach_label on the server).
function achLabel(r) {
  if (!r || r.ach_rank == null) return null;
  const noun = r.ach_scope === "show" ? "Show HN" : "Repo";
  if (r.ach_period === "live") return `#${r.ach_rank} on ${r.ach_scope === "front" ? "the Front Page" : "Show HN"}`;
  if (r.ach_period === "year") return `#${r.ach_rank} ${noun} of ${r.ach_date}`;
  return `#${r.ach_rank} ${noun} of the ${r.ach_period[0].toUpperCase() + r.ach_period.slice(1)}`;
}
function achWhen(r) {
  const d = r.ach_date || "";
  const [y, m, dd] = d.split("-");
  const long = dd ? date(Date.UTC(+y, m - 1, +dd) / 1000) : m ? new Date(Date.UTC(+y, m - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" }) : y;
  return r.ach_period === "week" ? `week of ${long}` : long;
}

// Badge picker shared by repo pages and /badges: style + where the badge links to.
function rankOptions(scopes) {
  return `<option value="">Best (automatic)</option>` + scopes.map(g => PERIODS.map(([k, t]) =>
    `<option value="${k}${g.scope === "show" ? "|show" : ""}">${g.scope === "show" ? "Show HN · " : ""}${k === "year" ? g.ranks.year.start.slice(0, 4) : t}: #${fmt(g.ranks[k].rank)}</option>`).join("")).join("");
}
function badgeBox(r, title) {
  return `<div class="badgebox" id="badgebox">
    <div class="badgehead"><b>${title}</b>
      <div class="seg" role="group" aria-label="Badge style">
        ${r.ach_rank != null ? `<button type="button" data-bs="rank" class="on">Rank</button><button type="button" data-bs="rank-dark">Rank (dark)</button>` : ""}<button type="button" data-bs="card"${r.ach_rank == null ? ' class="on"' : ""}>Card</button><button type="button" data-bs="card-dark">Card (dark)</button><button type="button" data-bs="small">Small</button>
      </div>
    </div>
    ${r._posts && r._posts.length > 1 ? `<label class="badgelink pick-row">Post
      <select id="post-pick" class="pick">${postOptions(r._posts)}</select></label>` : ""}
    ${r.ach_rank != null && r._rankings ? `<label class="badgelink pick-row" id="rank-pick-wrap">Ranking
      <select id="rank-pick" class="pick">${rankOptions(r._rankings)}</select></label>` : ""}
    <div class="badgepreview" id="badge-preview"></div>
    <div class="badgefmt">
      <div class="seg" role="group" aria-label="Code format">
        <button type="button" data-fmt="html" class="on">HTML</button><button type="button" data-fmt="md">Markdown</button>
      </div>
      <label class="badgelink" id="badge-center-wrap"><input type="checkbox" id="badge-center"> Center it</label>
    </div>
    <div class="badgecode"><code class="mono" id="badge-md"></code><button class="chip" id="copy-badge" type="button">Copy</button></div>
    <label class="badgelink"><input type="checkbox" id="badge-hn"> Link to the Hacker News post instead of HackerGit</label>
    <div class="badgehint">${fmt(r.points)} points and ${fmt(r.comments)} comments across ${fmt(r.subs)} HN post${r.subs === 1 ? "" : "s"}. The badge updates by itself.</div>
  </div>`;
}
function wireBadgeBox(r) {
  const box = $("#badgebox");
  if (!box) return;
  let style = r.ach_rank != null ? "rank" : "card", format = "html";
  const update = () => {
    let q = { small: "?", card: "?style=card", "card-dark": "?style=card&theme=dark",
              rank: "?style=rank", "rank-dark": "?style=rank&theme=dark" }[style];
    const postPick = $("#post-pick");
    const chosen = postPick && r._posts ? resolvePick(r._posts, postPick.value) : null;
    if (postPick && postPick.value !== "best") q += `${q === "?" ? "" : "&"}post=${postPick.value}`;
    const pick = $("#rank-pick"), pickWrap = $("#rank-pick-wrap");
    if (pickWrap) pickWrap.hidden = !style.startsWith("rank");
    if (pick && pick.value && style.startsWith("rank")) {
      const [per, sc] = pick.value.split("|");
      q += `&rank=${per}${sc ? "&scope=show" : ""}`;
    }
    if (q === "?") q = "";
    const img = `https://hackergit.org/badge/${r.repo}.svg${q}`;
    const href = $("#badge-hn").checked ? `https://news.ycombinator.com/item?id=${chosen ? chosen.id : r.top_id}` : `https://hackergit.org/r/${r.repo}`;
    const size = style === "small" ? 'height="20"' : 'width="250" height="55"';
    const alt = style.startsWith("rank") ? "Hacker News rank via HackerGit" : "Hacker News points via HackerGit";
    let code;
    if (format === "html") {
      code = `<a href="${href}"><img src="${img}" alt="${alt}" ${size}></a>`;
      if ($("#badge-center").checked) code = `<p align="center">\n  ${code}\n</p>`;
    } else {
      code = `[![${alt}](${img})](${href})`;
    }
    $("#badge-center-wrap").hidden = format !== "html";
    $("#badge-md").textContent = code;
    $("#badge-preview").innerHTML = `<img src="/badge/${esc(r.repo)}.svg${q}" alt="Hacker News badge"${style === "small" ? ' height="20"' : ""}>`;
    $("#badge-preview").classList.toggle("darkbg", style.endsWith("-dark"));
  };
  box.querySelectorAll("[data-bs]").forEach(b => b.onclick = () => {
    style = b.dataset.bs;
    box.querySelectorAll("[data-bs]").forEach(x => x.classList.toggle("on", x === b));
    update();
  });
  box.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => {
    format = b.dataset.fmt;
    box.querySelectorAll("[data-fmt]").forEach(x => x.classList.toggle("on", x === b));
    update();
  });
  $("#badge-hn").onchange = update;
  $("#badge-center").onchange = update;
  if ($("#rank-pick")) $("#rank-pick").onchange = update;
  if ($("#post-pick")) $("#post-pick").onchange = async () => {
    // the ranking choices follow the chosen post
    const chosen = resolvePick(r._posts, $("#post-pick").value);
    let scopes = r._rankings;
    if (chosen) { const pd = await api(`/api/post?id=${chosen.id}`).catch(() => null); if (pd) scopes = pd.scopes; }
    if ($("#rank-pick") && scopes) $("#rank-pick").innerHTML = rankOptions(scopes);
    update();
  };
  const cb = $("#copy-badge");
  cb.onclick = async () => {
    const text = $("#badge-md").textContent;
    try { await navigator.clipboard.writeText(text); cb.textContent = "Copied"; }
    catch { const rg = document.createRange(); rg.selectNodeContents($("#badge-md")); getSelection().removeAllRanges(); getSelection().addRange(rg); cb.textContent = "Press Ctrl/Cmd+C"; }
    setTimeout(() => { cb.textContent = "Copy"; }, 1600);
  };
  update();
}

function parseRepoInput(t) {
  t = (t || "").trim().replace(/\.git$/, "").replace(/\/+$/, "");
  const m = t.match(/(?:github\.com\/)?([A-Za-z0-9-]+)\/([A-Za-z0-9._-]+)$/);
  return m ? `${m[1]}/${m[2]}` : null;
}

}
function trendItem(r, n) {
  const tip = `Best position recorded${STATS && STATS.ranks_since ? ` (recording since ${date(STATS.ranks_since)})` : ""}`;
  const live = [r.front_best ? `<span class="rk${r.front_best <= 30 ? " hot" : ""}" title="${tip}">#${r.front_best} on the front page</span>` : "",
                r.show_best ? `<span class="rk${r.show_best <= 30 ? " hot" : ""}" title="${tip}">#${r.show_best} on Show HN</span>` : ""].join("");
  return `<li class="item"><div class="rank">${n}.</div><div>
    <div class="head">${repoName(r.repo, `/r/${esc(r.repo)}`, r.avatar)}${ghMeta(r)}</div>
    <div class="title"><a href="${hn(r.top_id)}" target="_blank" rel="noopener">${esc(r.top_title)}</a></div>
    ${live ? `<div class="rks">${live}</div>` : ""}
    ${r.descr ? `<div class="descr">${esc(r.descr)}</div>` : ""}
    <div class="meta">
      <span class="pts">${fmt(r.points)} points</span>
      <a href="${hn(r.top_id)}" target="_blank" rel="noopener">${fmt(r.comments)} comments</a>
      <span>by ${userLink(r.top_author, r.karma)}</span>
      <span>${ago(r.post_time)}</span>
    </div></div></li>`;
}

// ---------------------------------------------------------------- router
// ---------------------------------------------------------------- side panels (home page)
// The right panel's featured project. While no one has booked the slot (SPONSOR = null), it shows a project from
// today's trending list: of the top 3, the one with the fewest GitHub stars, so smaller projects get the spotlight.
// To show a paid placement instead, set SPONSOR, for example:
//   { repo: "kividbio/kividb", name: "KiviDB", url: "https://kividb.io", cta: "Try KiviDB",
//     pitch: "A fast, multi-threaded Redis and Valkey alternative written in Rust..." }
const SPONSOR = null;
const CONTACT_EMAIL = "support@hackergit.org";
// Audience size shown first on /advertise. Count people only: Cloudflare's dashboard "page views" include bots,
// so use real browsers (Chrome, Safari, Firefox, Edge) or Cloudflare Web Analytics. null hides it.
// About 1,200 human page views a day in Nov 2026.
const AUDIENCE = { value: "30k", label: "page views a month from developers" };
let railsDrawn = false;
function setRails(on) {
  const layout = $(".layout"), l = $("#rail-l"), r = $("#rail-r");
  layout.classList.toggle("rails", on);
  l.hidden = r.hidden = !on;
  if (!on || railsDrawn || !matchMedia("(min-width: 1280px)").matches) return;
  railsDrawn = true;
  drawTrendingRail(l);
  drawFeaturedRail(r);
}
async function drawTrendingRail(el) {
  const d = await api("/api/trending?period=day").catch(() => null);
  const items = (d && d.results || []).slice(0, 10);
  if (!items.length) { el.innerHTML = ""; return; }
  el.innerHTML = `<div class="rail-inner">
    <div class="rail-h"><span>Trending today</span><a href="/trending">See all</a></div>
    <ol class="tr-list">${items.map((r, i) => {
      const live = r.front_best ? `#${r.front_best} on front page` : r.show_best ? `#${r.show_best} on Show HN` : "";
      return `<li><a href="/r/${esc(r.repo)}" title="${esc(r.top_title)}">
        <span class="tr-n">${i + 1}</span>${avatar(r.owner, 20, r.avatar)}
        <span><span class="tr-name mono">${esc(r.repo)}</span>
        <span class="tr-m"><b>${fmt(r.points)}</b> pts · ${fmt(r.comments)} comments</span>
        ${live ? `<span class="tr-m tr-live">${live}</span>` : ""}</span></a></li>`;
    }).join("")}</ol></div>`;
}
async function drawFeaturedRail(el) {
  let f, r;
  if (SPONSOR) {
    f = SPONSOR;
    const d = await api(`/api/repo?key=${encodeURIComponent(f.repo)}`).catch(() => null);
    r = (d && d.repo) || {};
  } else {
    const d = await api("/api/trending?period=day").catch(() => null);
    const top = (d && d.results || []).slice(0, 3);
    if (!top.length) { el.innerHTML = ""; return; }
    r = top.reduce((a, b) => ((b.stars ?? 0) < (a.stars ?? 0) ? b : a));
    f = { repo: r.repo, name: r.repo, url: `/r/${r.repo}`, cta: "See it on HN", pitch: r.descr || r.top_title };
  }
  const link = (href, cls, text, extra = "") => /^https?:/.test(href)
    ? `<a class="${cls}" href="${esc(href)}" target="_blank" rel="${SPONSOR ? "sponsored " : ""}noopener"${extra}>${text}</a>`
    : `<a class="${cls}" href="${esc(href)}"${extra}>${text}</a>`;
  const img = r.og_image || (r.repo ? ogUrl(r) : "");
  el.innerHTML = `<div class="rail-inner">
    <div class="rail-h"><span>Featured</span>${SPONSOR ? "" : `<span class="feat-tag">Trending today</span>`}</div>
    <div class="feat">
      ${img ? link(f.url, "feat-img", `<img src="${esc(img)}" alt="" width="1280" height="640" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentElement.remove()">`, ' tabindex="-1" aria-hidden="true"') : ""}
      <div class="feat-body">
        ${link(f.url, "feat-name" + (SPONSOR ? "" : " mono"), `${avatar(f.repo.split("/")[0], 24, r.avatar)}<span>${esc(f.name)}</span>`)}
        ${f.pitch ? `<p>${esc(f.pitch.length > 160 ? f.pitch.slice(0, 157) + "…" : f.pitch)}</p>` : ""}
        <div class="feat-stats">
          ${r.stars != null ? `<span>★ <b>${short(r.stars)}</b> ${r.stars === 1 ? "star" : "stars"}</span>` : ""}
          ${r.lang ? `<span><span class="dot" style="background:${LANG_COLORS[r.lang] || "#8b949e"}"></span>${esc(r.lang)}</span>` : ""}
          ${r.points ? `<a href="/r/${esc(f.repo)}"><b>${fmt(r.points)}</b> HN points</a>` : ""}
        </div>
        <div class="feat-cta">${link(f.url, "primary", esc(f.cta))}${link(`https://github.com/${f.repo}`, "", "GitHub ↗")}</div>
      </div>
    </div>
    <a class="feat-ask" href="/advertise">Feature your project here →</a>
  </div>`;
}
addEventListener("resize", () => { if ($(".layout").classList.contains("rails")) setRails(true); }, { passive: true });
// Keep the panels current on an open tab: trending (and so the featured pick) refreshes every minute while visible.
setInterval(() => {
  if (document.hidden || !$(".layout").classList.contains("rails")) return;
  railsDrawn = false;
  setRails(true);
}, LIVE_MS);

function route() {
  const p = decodeURIComponent(location.pathname);
  window.scrollTo(0, 0);
  setRails(false);
  let m;
  if ((m = p.match(/^\/r\/([^/]+\/[^/]+)\/?$/))) return renderRepo(m[1]);
  if ((m = p.match(/^\/u\/([^/]+)\/?$/))) return renderUser(m[1]);
  if (p === "/about") return renderAbout();
  if (p === "/badges") return renderBadges();
  if (p === "/trending") return renderTrending();
  if (p === "/advertise") return renderAdvertise();
  setRails(true);
  return renderList();
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a || a.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey || a.origin !== location.origin) return;
  e.preventDefault(); go(a.pathname + a.search);
});
window.addEventListener("popstate", route);
// ---------------------------------------------------------------- search suggestions
(() => {
  const input = $("#q"), box = $("#sugg");
  let timer = 0, items = [], active = -1, lastQ = "";
  const close = () => { box.hidden = true; active = -1; };
  const highlight = () => items.forEach((a, i) => a.classList.toggle("on", i === active));
  const render = (q, d) => {
    if (input.value.trim() !== q) return;
    box.replaceChildren(); items = []; active = -1;
    const section = (title) => { const h = document.createElement("div"); h.className = "sugg-h"; h.textContent = title; box.append(h); };
    const row = (href, iconOwner, text, meta, av) => {
      const a = document.createElement("a"); a.href = href; a.setAttribute("role", "option");
      if (iconOwner) a.insertAdjacentHTML("afterbegin", avatar(iconOwner, 18, av));
      const t = document.createElement("span"); t.className = "mono"; t.textContent = text;
      const m = document.createElement("span"); m.className = "m"; m.textContent = meta;
      a.append(t, m); a.addEventListener("mousedown", (e) => e.preventDefault());
      a.addEventListener("click", (e) => { e.preventDefault(); close(); input.blur(); go(href); });
      box.append(a); items.push(a);
    };
    if (d.repos.length) { section("Repos"); d.repos.forEach(r => row(`/r/${r.repo}`, r.repo.split("/")[0], r.repo, `${fmt(r.points)} pts`, r.avatar)); }
    if (d.users.length) { section("HN users"); d.users.forEach(u => row(`/u/${encodeURIComponent(u.name)}`, null, u.name, `${short(u.karma)} karma`)); }
    box.hidden = !items.length;
  };
  input.addEventListener("input", () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (q.length < 2 || /\s|:/.test(q)) { close(); return; }  // words and by:/owner: filters go to full search
    timer = setTimeout(() => { lastQ = q; api(`/api/suggest?q=${encodeURIComponent(q)}`).then(d => render(q, d)).catch(close); }, 150);
  });
  input.addEventListener("keydown", (e) => {
    if (box.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % items.length; highlight(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + items.length) % items.length; highlight(); }
    else if (e.key === "Escape") { close(); }
    else if (e.key === "Enter" && active >= 0) { e.preventDefault(); items[active].click(); }
  });
  input.addEventListener("blur", () => setTimeout(close, 100));
})();

$("#search-form").onsubmit = (e) => {
  e.preventDefault();
  const s = location.pathname === "/" ? readState() : { ...DEFAULTS };
  go("/?" + stateQuery({ ...s, q: $("#q").value.trim() }));
};
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});
statsP.finally(route);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
