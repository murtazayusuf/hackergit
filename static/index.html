<style>
  :root {
    --bg: #ffffff; --bg2: #f6f8fa; --bg3: #eaeef2; --text: #1f2328; --muted: #59636e; --line: #d1d9e0;
    --accent: #ff6600; --accent-soft: rgba(255,102,0,.12); --link: #0969da; --hover: rgba(0,0,0,.04);
    --chip-on: #1f2328; --chip-on-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
      --accent-soft: rgba(255,102,0,.18); --link: #4493f8; --hover: rgba(255,255,255,.04);
      --chip-on: #e6edf3; --chip-on-text: #0d1117;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --bg2: #151b23; --bg3: #212830; --text: #e6edf3; --muted: #9198a1; --line: #30363d;
    --accent-soft: rgba(255,102,0,.18); --link: #4493f8; --hover: rgba(255,255,255,.04);
    --chip-on: #e6edf3; --chip-on-text: #0d1117;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button, select, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; padding: 0; }
  svg.i { width: 16px; height: 16px; fill: currentColor; flex: none; vertical-align: -3px; }
  .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1040px; margin: 0 auto; height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 19px; letter-spacing: -.5px; white-space: nowrap; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 18px; }
  .brand b { color: var(--accent); }
  .search { flex: 1; display: flex; align-items: center; max-width: 560px; min-width: 0; margin-left: auto; height: 38px;
            border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 0 10px; gap: 8px; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; height: 100%; }
  .search kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .gh-btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); font-size: 13px; font-weight: 600; flex: none; white-space: nowrap; }
  .gh-btn:hover { background: var(--bg3); }
  .gh-btn svg.i { vertical-align: 0; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }

  main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 64px; }
  .hero { padding: 20px 0 8px; }
  .hero h1 { font-size: 26px; letter-spacing: -.5px; margin: 0 0 4px; }
  .hero p { margin: 0; color: var(--muted); }
  .hero p a { color: var(--link); }

  .controls { display: flex; flex-direction: column; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { padding: 4px 12px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
  .chip:hover { background: var(--bg3); }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .filters select { height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg2); padding: 0 6px; max-width: 160px; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .reset { color: var(--link); font-size: 13px; margin-left: auto; }
  .summary { color: var(--muted); font-size: 13px; padding: 12px 0 4px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

  .list { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 40px 1fr; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .rank { color: var(--muted); text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; padding-top: 1px; }
  .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .av { border-radius: 6px; background: var(--bg3); flex: none; object-fit: cover; }
  .repo .av { vertical-align: -4px; margin-right: 8px; }
  .repohead .av { border-radius: 9px; }
  .repo { font-size: 16px; font-weight: 600; color: var(--link); word-break: break-word; }
  .repo:hover { text-decoration: underline; }
  .repo .own { font-weight: 400; }
  .gh { display: inline-flex; gap: 12px; color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(127,127,127,.3); }
  .title { margin: 3px 0 2px; }
  .title a:hover { text-decoration: underline; }
  .descr { color: var(--muted); margin: 2px 0; font-size: 13px; }
  .meta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; align-items: center; }
  .meta a:hover { color: var(--text); text-decoration: underline; }
  .meta .pts { color: var(--accent); font-weight: 600; }
  .karma { display: inline-block; padding: 0 6px; border-radius: 999px; background: var(--bg3); font-size: 11.5px; margin-left: 2px; font-variant-numeric: tabular-nums; }
  .more-subs { color: var(--link); }
  .subs { margin: 8px 0 0; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  .subs div { padding: 4px 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .subs div + div { border-top: 1px dashed var(--line); }
  .subs .t { flex: 1 1 260px; }
  .subs .m { color: var(--muted); font-size: 12px; }

  .loadmore { display: block; margin: 20px auto; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg2); }
  .loadmore:hover { background: var(--bg3); }
  #bar { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 30; opacity: 0; transition: opacity .2s; }
  body.busy .list { opacity: .55; transition: opacity .15s .1s; }
  .empty, .loading { color: var(--muted); padding: 48px 0; text-align: center; }

  .page h1 { font-size: 24px; margin: 18px 0 6px; word-break: break-word; }
  .page .crumb { color: var(--muted); font-size: 13px; }
  .page .crumb a { color: var(--link); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 120px; background: var(--bg2); }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12px; }
  .repohead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .repohead h1 { margin-right: auto; }
  .repostats { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13.5px; margin: 10px 0 6px; align-items: center; }
  .repostats b { color: var(--text); font-variant-numeric: tabular-nums; }
  h2.sect { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 26px 0 10px; }
  .postcards { display: flex; flex-direction: column; gap: 12px; }
  .postcard { display: grid; grid-template-columns: 78px 1fr; gap: 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .postcard.top { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .pts-box { align-self: start; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 10px 4px; }
  .pts-box b { display: block; font-size: 21px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .pts-box span { font-size: 11px; font-weight: 600; }
  .pc-flag { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 2px; }
  .pc-body { min-width: 0; }
  .pc-body .meta .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .postcard h3 { overflow-wrap: anywhere; margin: 0 0 4px; font-size: 17px; line-height: 1.35; }
  .postcard h3 a:hover { text-decoration: underline; }
  .postcard .meta { margin-top: 2px; }
  .discuss { max-width: 100%; display: inline-block; margin-top: 10px; padding: 6px 12px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--link); }
  .discuss:hover { background: var(--bg3); }
  .badgedetails { margin-top: 32px; border: 1px solid var(--line); border-radius: 10px; }
  .badgedetails summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 8px; }
  .badgedetails summary::-webkit-details-marker { display: none; }
  .badgedetails summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
  .badgedetails[open] summary::before { transform: rotate(90deg); }
  .badgedetails .badgebox { margin: 0 12px 12px; }
  @media (max-width: 640px) {
    .postcard { grid-template-columns: 58px 1fr; gap: 12px; padding: 14px; }
    .pts-box b { font-size: 17px; }
    .postcard h3 { font-size: 15.5px; }
  }
  .badgebox { margin: 18px 0 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg2); }
  .badgehead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .badgecode { display: flex; gap: 10px; align-items: center; }
  .badgecode code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12.5px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
  .badgehint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .hero-badge { margin-top: 8px !important; font-size: 14px; }
  .hero-badge a { color: var(--link); font-weight: 600; }
  .hero-badge a:hover { text-decoration: underline; }
  .badgeform { display: flex; gap: 10px; margin: 18px 0 4px; flex-wrap: wrap; }
  .badgeform input { flex: 1 1 260px; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg2); padding: 0 12px; outline: 0; }
  .badgeform input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .badgehint a { color: var(--link); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-left: auto; }
  .seg button { padding: 4px 12px; color: var(--muted); font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--chip-on); color: var(--chip-on-text); }
  .badgepreview { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; margin-bottom: 10px; background: #ffffff; }
  .badgepreview.darkbg { background: #0d1117; }
  .badgepreview img { display: block; max-width: 100%; }
  .badgefmt { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; }
  .badgefmt .seg { margin-left: 0; }
  .badgefmt .badgelink { margin-top: 0; }
  .badgecode code { white-space: pre; }
  .badgelink[hidden] { display: none; }
  .badgelink { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; cursor: pointer; }
  .badgehint code { font: 12px ui-monospace, monospace; }
  .about { max-width: 720px; font-size: 15px; line-height: 1.65; }
  .about h2 { font-size: 18px; margin: 28px 0 6px; }
  .about a { color: var(--link); }
  .about code { font: 13px ui-monospace, monospace; background: var(--bg2); padding: 1px 5px; border-radius: 4px; }
  footer { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); display: flex; gap: 16px; flex-wrap: wrap; }
  footer a { color: var(--link); }

  @media (max-width: 640px) {
    .bar { gap: 8px; }
    .brand span.word { display: none; }
    .search kbd { display: none; }
    .gh-btn { width: 32px; padding: 0; justify-content: center; }
    .gh-btn span { display: none; }
    .bar { padding: 0 12px; }
    .icon-btn { width: 32px; }
    .controls .row:first-child { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .controls .row:first-child > * { flex: none; }
    .item { grid-template-columns: 28px 1fr; }
    .rank { padding-right: 4px; font-size: 12px; }
    .gh { margin-left: 0; width: 100%; }
    .hero h1 { font-size: 21px; }
  }
</style>
</head>

<script>
const $ = (s, el = document) => el.querySelector(s);
const view = $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => Number(n || 0).toLocaleString("en-US");
const short = (n) => n == null ? "" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "m" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(n);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const date = (t) => { const d = new Date(t * 1000); return `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`; };
const ago = (t) => { const s = Date.now() / 1000 - t; if (s < 3600) return `${Math.max(1, Math.round(s / 60))} min ago`; if (s < 86400) return `${Math.round(s / 3600)} h ago`; return `${Math.round(s / 86400)} days ago`; };
const hn = (id) => `https://news.ycombinator.com/item?id=${id}`;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// Browser cache: responses live in memory for this visit and in localStorage across visits.
// Saved responses are only reused while the site's data version (from /api/stats) is unchanged.
const MEMO = new Map();
const SAVED_KEY = "hg-cache-v1";
let saved = (() => { try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || { ver: null, items: {} }; } catch { return { ver: null, items: {} }; } })();
let saveTimer = 0;
function persist(path, data) {
  if (!STATS || path.startsWith("/api/stats")) return;
  if (saved.ver !== STATS.version) saved = { ver: STATS.version, items: {} };
  saved.items[path] = data;
  const keys = Object.keys(saved.items);
  if (keys.length > 120) delete saved.items[keys[0]];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(saved)); }
    catch { saved.items = {}; try { localStorage.removeItem(SAVED_KEY); } catch {} }
  }, 300);
}
function api(path) {
  if (!MEMO.has(path) && STATS && saved.ver === STATS.version && saved.items[path] !== undefined) {
    MEMO.set(path, Promise.resolve(saved.items[path]));
  }
  if (!MEMO.has(path)) {
    const p = fetch(path, path.startsWith("/api/stats") ? { cache: "no-cache" } : undefined).then(r => {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }).then(d => { persist(path, d); return d; });
    p.catch(() => MEMO.delete(path));
    MEMO.set(path, p);
    if (MEMO.size > 300) MEMO.delete(MEMO.keys().next().value);
  }
  return MEMO.get(path);
}

const DEFAULTS = { q: "", view: "repos", type: "", sort: "points", min_points: "", min_comments: "", min_karma: "", max_karma: "", min_stars: "", from: "", to: "", lang: "" };
function readState() {
  const p = new URLSearchParams(location.search), s = { ...DEFAULTS };
  for (const k in DEFAULTS) if (p.has(k)) s[k] = p.get(k);
  if (location.pathname === "/show-hn" && !p.has("type")) s.type = "show";
  return s;
}
function stateQuery(s, extra = {}) {
  const p = new URLSearchParams();
  for (const k in DEFAULTS) if (s[k] && s[k] !== DEFAULTS[k]) p.set(k, s[k]);
  for (const k in extra) p.set(k, extra[k]);
  return p.toString();
}
function go(url, replace = false) { history[replace ? "replaceState" : "pushState"]({}, "", url); route(); }

function showPage(s, page, d, token) {
  const list = $("#list"), tail = $("#tail");
  if (!list || token !== navToken) return;
  $("#count").textContent = `${fmt(d.total)} repos`;
  const start = page * d.page_size;
  list.insertAdjacentHTML("beforeend", d.results.map((r, i) => repoItem(r, start + i + 1)).join(""));
  if (!d.total) { tail.innerHTML = `<div class="empty">No repos match. Try fewer filters.</div>`; return; }
  if (start + d.results.length >= d.total) { tail.innerHTML = ""; return; }
  const next = searchUrl(s, page + 1);
  prefetch(next);  // so "Load more" is instant
  tail.innerHTML = `<button class="loadmore">Load more</button>`;
  tail.firstChild.onclick = async () => {
    tail.firstChild.disabled = true; tail.firstChild.textContent = "Loading…";
    try { showPage(s, page + 1, await api(next), token); }
    catch (e) { tail.innerHTML = `<div class="empty">Something went wrong. Try again.</div>`; }
  };
}

function wireBadgeBox(r) {

    const img = `https://hackergit.org/badge/${r.repo}.svg${q}`;
    const href = $("#badge-hn").checked ? `https://news.ycombinator.com/item?id=${r.top_id}` : `https://hackergit.org/r/${r.repo}`;
    const size = style === "small" ? 'height="20"' : 'width="250" height="55"';
    let code;
    if (format === "html") {
      code = `<a href="${href}"><img src="${img}" alt="Hacker News" ${size}></a>`;
      if ($("#badge-center").checked) code = `<p align="center">\n  ${code}\n</p>`;
    } else {
      code = `[![Hacker News](${img})](${href})`;
    }
    $("#badge-center-wrap").hidden = format !== "html";
    $("#badge-md").textContent = code;
    $("#badge-preview").innerHTML = `<img src="/badge/${esc(r.repo)}.svg${q}" alt="Hacker News badge"${style === "small" ? ' height="20"' : ""}>`;
    $("#badge-preview").classList.toggle("darkbg", style === "card-dark");
  };
  box.querySelectorAll("[data-bs]").forEach(b => b.onclick = () => {
    style = b.dataset.bs;
    box.querySelectorAll("[data-bs]").forEach(x => x.classList.toggle("on", x === b));
    update();
  });
  box.querySelectorAll("[data-fmt]").forEach(b => b.onclick = () => {
    format = b.dataset.fmt;
    box.querySelectorAll("[data-fmt]").forEach(x => x.classList.toggle("on", x === b));
    update();
  });
  $("#badge-hn").onchange = update;
  $("#badge-center").onchange = update;
  const cb = $("#copy-badge");
  cb.onclick = async () => {
    const text = $("#badge-md").textContent;
    try { await navigator.clipboard.writeText(text); cb.textContent = "Copied"; }
    catch { const rg = document.createRange(); rg.selectNodeContents($("#badge-md")); getSelection().removeAllRanges(); getSelection().addRange(rg); cb.textContent = "Press Ctrl/Cmd+C"; }
    setTimeout(() => { cb.textContent = "Copy"; }, 1600);
  };
  update();
}

function parseRepoInput(t) {
  t = (t || "").trim().replace(/\.git$/, "").replace(/\/+$/, "");
  const m = t.match(/(?:github\.com\/)?([A-Za-z0-9-]+)\/([A-Za-z0-9._-]+)$/);
  return m ? `${m[1]}/${m[2]}` : null;
}

function renderBadges() {
  document.title = "Hacker News badge for your GitHub README (Show HN badge) - HackerGit";
  const initial = new URLSearchParams(location.search).get("repo") || "";
  view.innerHTML = `<div class="page about">
    <h1>A Hacker News badge for your README</h1>
    <p>If your repo was posted on Hacker News, show how it did. The badge updates by itself and links to every HN post of your repo.</p>
    <form id="badge-form" class="badgeform">
      <input id="badge-repo" class="mono" placeholder="owner/repo or a GitHub link" value="${esc(initial)}" autocomplete="off" aria-label="GitHub repo">
      <button class="chip on" type="submit">Get badge</button>
    </form>
    <div id="badge-out"></div>
    <h2>Options</h2>
    <ul>
      <li><code>?show=comments</code> or <code>?show=posts</code> on the image link shows other numbers.</li>
      <li><code>?label=HN</code> makes the label shorter.</li>
      <li><code>?style=card</code> gives the larger card with points, comments and posts; add <code>&amp;theme=dark</code> for dark READMEs.</li>
      <li>Prefer to send readers straight to Hacker News? Tick "Link to the Hacker News post" and the badge links to your top HN post.</li>
      <li>Repos never posted on HN get a gray "not posted yet" badge, so a README never shows a broken image.</li>
    </ul>
  </div>`;
  const out = $("#badge-out");
  const show = async (key) => {
    history.replaceState({}, "", `/badges?repo=${encodeURIComponent(key)}`);
    out.innerHTML = `<div class="badgebox"><div class="badgehint">Looking up ${esc(key)}…</div></div>`;
    const d = await api(`/api/repo?key=${encodeURIComponent(key)}`).catch(() => null);
    if (!d) {
      out.innerHTML = `<div class="badgebox"><div class="badgehead"><b class="mono">${esc(key)}</b><img src="/badge/${esc(key)}.svg" alt="" height="20"></div>
        <div class="badgehint">This repo hasn't been posted on Hacker News yet (as a link to its GitHub page). Check the spelling, or try again after it's been posted.</div></div>`;
      return;
    }
    out.innerHTML = badgeBox(d.repo, `<span class="mono">${esc(d.repo.repo)}</span> · <a href="/r/${esc(d.repo.repo)}">see its HN posts</a>`);
    wireBadgeBox(d.repo);
  };
  $("#badge-form").onsubmit = (e) => {
    e.preventDefault();
    const key = parseRepoInput($("#badge-repo").value);
    if (!key) { out.innerHTML = `<div class="badgebox"><div class="badgehint">Enter it as owner/repo, like karpathy/nanoGPT, or paste the GitHub link.</div></div>`; return; }
    show(key);
  };
  if (parseRepoInput(initial)) show(parseRepoInput(initial)); else $("#badge-repo").focus();
}

      <li><b>Karma</b> comes from the <a href="https://github.com/HackerNews/API">official HN API</a>, one lookup per poster,
        refreshed weekly.</li>

      <li>New posts are picked up every few minutes, and points and comment counts keep updating for a few days after a post.</li>
      <li>Links to a file or folder inside a repo count for that repo. The same repo posted several times shows up once under

}

// ---------------------------------------------------------------- router
function route() {
  const p = decodeURIComponent(location.pathname);
  window.scrollTo(0, 0);
  let m;
  if ((m = p.match(/^\/r\/([^/]+\/[^/]+)\/?$/))) return renderRepo(m[1]);
  if ((m = p.match(/^\/u\/([^/]+)\/?$/))) return renderUser(m[1]);
  if (p === "/about") return renderAbout();
  if (p === "/badges") return renderBadges();
  return renderList();
}

document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a || a.target === "_blank" || e.metaKey || e.ctrlKey || e.shiftKey || a.origin !== location.origin) return;
  e.preventDefault(); go(a.pathname + a.search);
});
window.addEventListener("popstate", route);
$("#search-form").onsubmit = (e) => {
  e.preventDefault();
  const s = location.pathname === "/" ? readState() : { ...DEFAULTS };
  go("/?" + stateQuery({ ...s, q: $("#q").value.trim() }));
};
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
});
statsP.finally(route);
</script>
