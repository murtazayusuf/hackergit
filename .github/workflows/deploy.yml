name: Deploy to AWS Lightsail

# Creates the server on the first run, then updates the code on every push to main.
# Needs one secret, AWS_ROLE_ARN (see deploy/aws-bootstrap.sh). Optional:
#   secret   STARS_GITHUB_TOKEN  GitHub token for stars / language / description
#   variable DOMAIN              default hackergit.org
#   variable AWS_REGION          default us-east-1
#   variable BUNDLE_ID           Lightsail plan; default: cheapest 1 GB plan with a public IPv4 address

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "fly.toml", "Dockerfile", ".dockerignore"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  DOMAIN: ${{ vars.DOMAIN || 'hackergit.org' }}
  INSTANCE: hackergit
  STATIC_IP: hackergit-ip
  AWS_PAGER: ""

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy skipped: add the AWS_ROLE_ARN repository secret first (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show what GitHub sends AWS (for troubleshooting sign-in)
        continue-on-error: true
        env:
          ROLE: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'EOF'
          import base64, json, sys
          part = sys.argv[1].split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)))
          for k in ("sub", "aud", "iss", "repository", "ref"):
              print(f"{k}: {claims.get(k)}")
          EOF
          if [[ "$ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/(.+)$ ]]; then
            echo "AWS_ROLE_ARN looks valid; role name: ${BASH_REMATCH[1]}"
          else
            echo "::warning::AWS_ROLE_ARN does not look like arn:aws:iam::<12-digit account>:role/<name> (check for spaces or quotes)."
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create the server (first run only)
        env:
          BUNDLE: ${{ vars.BUNDLE_ID }}
        run: |
          set -euo pipefail
          if aws lightsail get-instance --instance-name "$INSTANCE" >/dev/null 2>&1; then
            echo "Server '$INSTANCE' already exists."
          else
            if [ -z "$BUNDLE" ]; then
              BUNDLE=$(aws lightsail get-bundles --output json | jq -r '
                [.bundles[] | select(.isActive and .ramSizeInGb == 1
                  and ((.publicIpv4AddressCount // 1) >= 1)
                  and (.supportedPlatforms | index("LINUX_UNIX"))
                  and (.bundleId | test("ipv6") | not))]
                | sort_by(.price) | .[0].bundleId')
            fi
            BLUEPRINT=$(aws lightsail get-blueprints --output json | jq -r '
              [.blueprints[] | select(.isActive and .platform == "LINUX_UNIX"
                and (.blueprintId | test("^ubuntu_2[4-9]_04$")))]
              | sort_by(.blueprintId) | .[0].blueprintId')
            if [ -z "$BUNDLE" ] || [ "$BUNDLE" = null ] || [ -z "$BLUEPRINT" ] || [ "$BLUEPRINT" = null ]; then
              echo "::error::Could not pick a Lightsail plan ($BUNDLE) or Ubuntu image ($BLUEPRINT)."; exit 1
            fi
            echo "Creating '$INSTANCE': $BLUEPRINT on plan $BUNDLE in ${AWS_REGION}a"
            aws lightsail create-instances --instance-names "$INSTANCE" \
              --availability-zone "${AWS_REGION}a" --blueprint-id "$BLUEPRINT" --bundle-id "$BUNDLE" \
              --tags key=app,value=hackergit >/dev/null
          fi
          STATE=""
          for _ in $(seq 1 60); do
            STATE=$(aws lightsail get-instance --instance-name "$INSTANCE" --query 'instance.state.name' --output text)
            [ "$STATE" = running ] && break
            echo "Server state: $STATE"; sleep 5
          done
          [ "$STATE" = running ] || { echo "::error::Server did not reach 'running' (state: $STATE)."; exit 1; }

      - name: Static IP and firewall
        id: ip
        run: |
          set -euo pipefail
          aws lightsail get-static-ip --static-ip-name "$STATIC_IP" >/dev/null 2>&1 \
            || aws lightsail allocate-static-ip --static-ip-name "$STATIC_IP" >/dev/null
          ATTACHED=$(aws lightsail get-static-ip --static-ip-name "$STATIC_IP" --query 'staticIp.attachedTo' --output text)
          if [ "$ATTACHED" != "$INSTANCE" ]; then
            aws lightsail attach-static-ip --static-ip-name "$STATIC_IP" --instance-name "$INSTANCE" >/dev/null
          fi
          # Web ports accept only Cloudflare, so nobody can skip its cache by calling the server's IP.
          # SSH stays open: GitHub's runners and the Lightsail browser console have changing IPs.
          # If Cloudflare's IP list can't be fetched, keep the web ports open rather than lock the site out.
          V4=$(curl -fsS --retry 3 https://www.cloudflare.com/ips-v4 | jq -R -s -c 'split("\n") | map(select(length > 0))' || true)
          V6=$(curl -fsS --retry 3 https://www.cloudflare.com/ips-v6 | jq -R -s -c 'split("\n") | map(select(length > 0))' || true)
          if [ "$(echo "${V4:-[]}" | jq length)" -ge 10 ] && [ "$(echo "${V6:-[]}" | jq length)" -ge 5 ]; then
            WEB=$(jq -n -c --argjson v4 "$V4" --argjson v6 "$V6" \
              '[80, 443] | map({fromPort: ., toPort: ., protocol: "tcp", cidrs: $v4, ipv6Cidrs: $v6})')
            echo "Web ports limited to Cloudflare ($(echo "$V4" | jq length) IPv4 + $(echo "$V6" | jq length) IPv6 ranges)."
          else
            WEB='[{"fromPort":80,"toPort":80,"protocol":"tcp"},{"fromPort":443,"toPort":443,"protocol":"tcp"}]'
            echo "::warning::Could not fetch Cloudflare IP ranges; web ports left open to everyone."
          fi
          PORTS=$(jq -n -c --argjson web "$WEB" '[{fromPort: 22, toPort: 22, protocol: "tcp"}] + $web')
          aws lightsail put-instance-public-ports --instance-name "$INSTANCE" --port-infos "$PORTS" >/dev/null
          IP=$(aws lightsail get-static-ip --static-ip-name "$STATIC_IP" --query 'staticIp.ipAddress' --output text)
          echo "Server IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install or update HackerGit on the server
        env:
          IP: ${{ steps.ip.outputs.ip }}
          STARS_TOKEN: ${{ secrets.STARS_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh -V
          # Way 1: Lightsail's short-lived SSH key + certificate (what the console's browser SSH uses).
          cert_key() {
            aws lightsail get-instance-access-details --instance-name "$INSTANCE" --protocol ssh --output json > /tmp/access.json
            jq -r .accessDetails.privateKey /tmp/access.json > ~/.ssh/ls_cert
            jq -r .accessDetails.certKey /tmp/access.json > ~/.ssh/ls_cert-cert.pub
            SSH_USER=$(jq -r .accessDetails.username /tmp/access.json)
            chmod 600 ~/.ssh/ls_cert && rm -f /tmp/access.json
          }
          # Way 2: the region's default Lightsail key, which the server was created with.
          default_key() {
            K=$(aws lightsail download-default-key-pair --query privateKeyBase64 --output text)
            if [[ "$K" == -----BEGIN* ]]; then printf '%s\n' "$K" > ~/.ssh/ls_default
            else printf '%s' "$K" | base64 -d > ~/.ssh/ls_default; fi
            chmod 600 ~/.ssh/ls_default
          }
          OPTS=(-o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
                -o ConnectTimeout=10 -o ServerAliveInterval=30)
          try() {  # try <mode> [ssh args...]
            if [ "$1" = cert ]; then KEY=(-i ~/.ssh/ls_cert -o CertificateFile="$HOME/.ssh/ls_cert-cert.pub")
            else KEY=(-i ~/.ssh/ls_default); fi
            shift
            ssh "${KEY[@]}" "${OPTS[@]}" "${SSH_USER:-ubuntu}@$IP" "$@"
          }
          MODE=""
          default_key || echo "Could not download the default key pair."
          for i in $(seq 1 30); do
            cert_key
            if try cert true 2>/tmp/err.cert; then MODE=cert; break; fi
            if [ -s ~/.ssh/ls_default ] && try default true 2>/tmp/err.default; then MODE=default; break; fi
            if [ "$i" = 1 ] || [ $((i % 6)) = 0 ]; then
              echo "Attempt $i: certificate login: $(tail -1 /tmp/err.cert)"
              echo "Attempt $i: default key login: $(tail -1 /tmp/err.default 2>/dev/null)"
            fi
            if [ "$i" = 30 ]; then
              echo "::group::Certificate details"; ssh-keygen -L -f ~/.ssh/ls_cert-cert.pub || true; echo "::endgroup::"
              echo "::group::Verbose SSH (certificate)"; try cert -v true 2>&1 | tail -40 || true; echo "::endgroup::"
              echo "::group::Verbose SSH (default key)"; try default -v true 2>&1 | tail -40 || true; echo "::endgroup::"
              echo "::error::Could not SSH into $IP."; exit 1
            fi
            echo "Waiting for SSH..."; sleep 10
          done
          echo "Logged in with the $MODE key."
          tar czf - hackergit.py server.py static deploy \
            | try "$MODE" 'rm -rf /tmp/hackergit-src && mkdir -p /tmp/hackergit-src && tar xzf - -C /tmp/hackergit-src'
          printf '%s\n' "$STARS_TOKEN" \
            | try "$MODE" "sudo env DOMAIN='$DOMAIN' bash /tmp/hackergit-src/deploy/setup.sh /tmp/hackergit-src"
          rm -f ~/.ssh/ls_cert ~/.ssh/ls_cert-cert.pub ~/.ssh/ls_default

      - name: Check the site
        env:
          IP: ${{ steps.ip.outputs.ip }}
        run: |
          # Checked through Cloudflare (the server only accepts Cloudflare); the query string skips any cache.
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "https://$DOMAIN/healthz?deploy=$GITHUB_RUN_ID"
          echo
          {
            echo "## HackerGit is deployed"
            echo ""
            echo "- Server IP: \`$IP\` (web ports only accept Cloudflare; SSH stays open)"
            echo "- DNS at your domain registrar: \`A\` record for \`$DOMAIN\` and \`www.$DOMAIN\` pointing to \`$IP\`"
            echo "- Then https://$DOMAIN works; HTTPS certificates are set up automatically."
            echo "- On the very first deploy, repos appear after ~5 minutes and karma after ~15."
          } >> "$GITHUB_STEP_SUMMARY"
